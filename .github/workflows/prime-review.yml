name: prime review

# Prime Agent reviews the owner's pull requests and acts on the owner's
# /prime comments: it pushes mechanical fixes, posts one-click suggestions,
# and raises design issues (repo/prime-reviewer.md).
#
# On pull request events the job is named `ai review`, the required check on
# main (decisions/pull-request-gate.md). It fails on a blocker under
# repo/review.md section 1 or 5, and on any pull request not opened by the
# owner. A push by the owner gets a quiet re-review (it comments only when it
# has something new); a push of the reviewer's own fixes reuses its verdict.
# On /prime comments the job is named `prime` and is not a check.
#
# pull_request_target, not pull_request: this workflow always
# comes from main and selects the shared action, so a pull request cannot
# rewrite the gate that judges it.
# The job checks out the pull request and lets the agent run commands in it,
# with a model key and a token that can push; that is safe only because the
# action's first step stops every pull request and comment not from the owner. Keep
# that guard first in the action.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: prime-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prime:
    name: ${{ github.event_name == 'pull_request_target' && 'ai review' || 'prime' }}
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.login == github.repository_owner
        && startsWith(github.event.comment.body, '/prime'))
      || (github.event_name == 'pull_request_review_comment'
        && github.event.comment.user.login == github.repository_owner
        && startsWith(github.event.comment.body, '/prime'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Review with Prime
        uses: amangupta20/prime-reviewer-action@v1
        with:
          app-id: ${{ vars.PRIME_APP_ID }}
          app-private-key: ${{ secrets.PRIME_APP_PRIVATE_KEY }}
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
          state-backend: b2
          b2-endpoint-url: ${{ secrets.PRIME_B2_ENDPOINT_URL }}
          b2-bucket: ${{ secrets.PRIME_B2_BUCKET }}
          b2-region: ${{ secrets.PRIME_B2_REGION }}
          b2-access-key-id: ${{ secrets.PRIME_B2_ACCESS_KEY_ID }}
          b2-secret-access-key: ${{ secrets.PRIME_B2_SECRET_ACCESS_KEY }}
