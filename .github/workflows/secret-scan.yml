name: secret-scan

# A backstop, not prevention: this runs after the push, so a leaked commit is
# already on the remote by the time it reports. The local hooks are the only
# thing that stops a secret leaving the machine. Make this job a required status
# check (plus branch protection) if a red result should block a merge.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so an old commit cannot hide

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version

      # -v is deliberately not used here: verbose output prints roughly 20
      # unmasked characters either side of the matched value, and the Actions
      # log is a permanent copy. The summary still names the count; the local
      # hooks (whose output only reaches the operator) use -v for detail.
      - name: Scan history
        run: |
          cp secret-scan.toml "$RUNNER_TEMP/rules.toml"
          gitleaks git --redact --no-banner -c "$RUNNER_TEMP/rules.toml"
