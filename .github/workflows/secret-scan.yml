name: secret-scan

# Backstop for the local hooks: a commit made with --no-verify, or a clone where
# nobody ran `mise run hooks:install`, still fails here before it can merge.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so an old commit cannot hide

      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history
        run: gitleaks git --redact --no-banner -c secret-scan.toml

      # gitleaks never scans the file passed as its own config, so the rules
      # file gets one pass with a throwaway copy as the config.
      - name: Scan the rules file itself
        run: |
          cp secret-scan.toml "$RUNNER_TEMP/rules.toml"
          gitleaks dir secret-scan.toml --redact --no-banner -c "$RUNNER_TEMP/rules.toml"

