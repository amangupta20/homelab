name: secret-scan

# A backstop, not prevention: this runs after the push, so a leaked commit is
# already on the remote by the time it reports. The local hooks are the only
# thing that stops a secret leaving the machine. Make this job a required status
# check (plus branch protection) if a red result should block a merge.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so an old commit cannot hide

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version

      # The rules file is handed to gitleaks as a throwaway copy, because
      # gitleaks exempts the exact -c path from scanning. Without this the rules
      # file could carry a credential through the whole history scan unnoticed.
      # -v names file/rule/commit; --redact keeps the value masked.
      - name: Scan history
        run: |
          cp secret-scan.toml "$RUNNER_TEMP/rules.toml"
          gitleaks git --redact --no-banner -v -c "$RUNNER_TEMP/rules.toml"
