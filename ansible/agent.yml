# agent-1, the agent VM (agents/plans/home-overhaul.md, step B0): the owner's user, Docker, the tools agents
# need, and the coding-agent harnesses. Run from ansible/ after common.yml, xcpng.yml and cache-client.yml:
#   ansible-playbook agent.yml --check --diff      # read this first
#   ansible-playbook agent.yml
#
# Everything downloads through the LAN cache on cache-1 (apps/homeserver/artifact-keeper/remotes.txt): apt
# through cache-client.yml's mirror lists and the vendor remotes below, Docker images through the daemon's
# mirror, gh from the `github-releases` remote, Node and npm packages through mise's settings
# (files/agent/mise-config.toml).
- name: agent-1
  hosts: agent-1
  become: true
  vars:
    lan_cache: http://10.22.33.137
    user: aman
    gh_version: "2.105.0"
    # GitHub's published digest for gh_2.105.0_linux_amd64.deb (`gh release view`, 2026-11-22); the copy
    # fetched through the cache matched it.
    gh_sha256: "1dac939af3e84fb3861927c984b357531341be9403b889e4aa86e8822145a09d"
    # mise's apt signing key, fingerprint 24853EC9F655CE80B48E6C3A8B81C9D17413A06D (`gpg --show-keys`,
    # 2026-11-22; the key that signs the repository's Release file). Expires 2028-01-02.
    # The OpenBao CLI, as on the owner's workstation; GitHub's digest for openbao_2.7.3_linux_amd64.deb
    # (`gh release view`, 2026-11-22).
    bao_version: "2.7.3"
    # Cloudflare's public DNS over TLS, for the resolved drop-in below.
    cloudflare_dns: "1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com" # gitleaks:allow (Cloudflare's public resolvers, not lab addresses)
    bao_sha256: "0800c71469c1d7a5d5c9fb37ce0e441cad97d9fe122dab70391c8371e290b935" # gitleaks:allow (a release file's SHA-256, not a secret)
    mise_key_sha256: "91c72340c5cc84ae2ba98c1070083feacf789b0a4a3d34b2416147769e475d96" # gitleaks:allow (the SHA-256 of mise's public signing key, not a secret)
    # The Orca server's first install; orca-server-update.timer moves it forward after that. The digest is
    # Orca's orca-server-sha256sums.txt for v1.4.269 (2026-11-22); the copy fetched through the cache matched it.
    orca_version: "1.4.269"
    orca_sha256: "f28156c0ceda9d034d9c55e27f5c0b73f38de70e4ec8b4ba8d740c00f26d0e74" # gitleaks:allow (a release file's SHA-256, not a secret)
  tasks:
    # The owner asked for agent-1 to be fully up to date (2026-11-22). A second run finds nothing to do.
    - name: Full upgrade
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        cache_valid_time: 3600

    - name: Is a reboot needed
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot after a kernel or library upgrade
      ansible.builtin.reboot:
      when: reboot_required.stat.exists

    # DNS through Cloudflare over TLS, as on the owner's workstation. The router's dnsmasq drops public
    # records that point at tailnet addresses (rebind protection; 2026-11-22 it answered nothing for
    # OpenBao's name where Cloudflare answered), and the owner's tools reach OpenBao and Hindsight by such names.
    # Tailscale's MagicDNS keeps its own routing domain on tailscale0.
    - name: systemd-resolved's settings folder
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"

    - name: DNS through Cloudflare over TLS
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/cloudflare.conf
        content: |
          # Written by ansible/agent.yml.
          [Resolve]
          DNS={{ cloudflare_dns }}
          DNSOverTLS=yes
          Domains=~.
        mode: "0644"
      register: resolved_conf

    - name: Apply the DNS settings
      ansible.builtin.systemd_service:
        name: systemd-resolved
        state: restarted
      when: resolved_conf is changed

    - name: Packages from Debian
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          # Lets Ansible hand its temporary files to the owner's user (become_user, the mise tasks below).
          - acl
          - git
          - tmux
          - jq
          - ripgrep
          - curl
          - unzip
          - build-essential
          - python3-venv
          # mise installs Python tools such as this repo's ansible-core with it.
          - pipx
          # For headless browsing and screenshots; Playwright can drive it (executablePath /usr/bin/chromium).
          - chromium
          - fonts-noto-core
          - fonts-noto-color-emoji

    # The owner's user: harnesses, Orca workers and the owner's own work run as this user, and its home
    # folder is what agent-1's backup keeps (agents/plans/home-overhaul.md, B0). `debian` stays for Ansible.
    - name: The owner's user
      ansible.builtin.user:
        name: "{{ user }}"
        shell: /bin/bash
        groups: [sudo, docker]
        append: true

    # Convenient by default (agents/rules/agent-access.md).
    - name: Passwordless sudo for the owner's user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ user }}"
        content: "{{ user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    # The homelab VM key (kv/general/vm-ssh), which Orca and the owner use to reach it.
    - name: SSH key for the owner's user
      ansible.posix.authorized_key:
        user: "{{ user }}"
        key: "{{ lookup('pipe', 'bao kv get -mount=kv -field=public_key general/vm-ssh') }}"
      # In --check the user above is not created yet.
      ignore_errors: "{{ ansible_check_mode }}"

    # Not on the cache's apt remote: its path ends in /packages, which Artifact Keeper rejects as an index
    # file (is_debian_flat_or_mirrorlist, repository_service.rs). The release .deb comes through the
    # `github-releases` remote instead, pinned by its digest.
    - name: Download gh {{ gh_version }}
      ansible.builtin.get_url:
        url: "{{ lan_cache }}/general/github-releases/cli/cli/releases/download/v{{ gh_version }}/gh_{{ gh_version }}_linux_amd64.deb"
        dest: "/var/cache/gh_{{ gh_version }}_linux_amd64.deb"
        checksum: "sha256:{{ gh_sha256 }}"
        mode: "0644"
        timeout: 300

    - name: Install gh {{ gh_version }}
      ansible.builtin.apt:
        deb: "/var/cache/gh_{{ gh_version }}_linux_amd64.deb"
      ignore_errors: "{{ ansible_check_mode }}"

    # The CLI only: the package also ships the server's unit, which stays disabled and stopped.
    - name: Download the OpenBao CLI {{ bao_version }}
      ansible.builtin.get_url:
        url: "{{ lan_cache }}/general/github-releases/openbao/openbao/releases/download/v{{ bao_version }}/openbao_{{ bao_version }}_linux_amd64.deb"
        dest: "/var/cache/openbao_{{ bao_version }}_linux_amd64.deb"
        checksum: "sha256:{{ bao_sha256 }}"
        mode: "0644"
        timeout: 300

    - name: Install the OpenBao CLI {{ bao_version }}
      ansible.builtin.apt:
        deb: "/var/cache/openbao_{{ bao_version }}_linux_amd64.deb"
      ignore_errors: "{{ ansible_check_mode }}"

    - name: The OpenBao server stays off here
      ansible.builtin.systemd_service:
        name: openbao.service
        state: stopped
        enabled: false
      ignore_errors: "{{ ansible_check_mode }}"

    - name: mise's package signing key
      ansible.builtin.get_url:
        url: https://mise.jdx.dev/gpg-key.pub
        dest: /usr/share/keyrings/mise-archive-keyring.asc
        checksum: "sha256:{{ mise_key_sha256 }}"
        mode: "0644"

    - name: mise's package repository, through the cache
      ansible.builtin.deb822_repository:
        name: mise
        uris: "{{ lan_cache }}/debian/mise-apt"
        suites: stable
        components: main
        architectures: amd64
        signed_by: /usr/share/keyrings/mise-archive-keyring.asc

    - name: Tailscale's package signing key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    # Installed only; joining the tailnet with tag:agent is the owner's sign-in (plan, B0).
    - name: Tailscale's package repository, through the cache
      ansible.builtin.deb822_repository:
        name: tailscale
        uris: "{{ lan_cache }}/debian/tailscale-apt"
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg

    - name: Install mise and Tailscale
      ansible.builtin.apt:
        name: [mise, tailscale]
        update_cache: true
      ignore_errors: "{{ ansible_check_mode }}"

    - name: mise's configuration folder
      ansible.builtin.file:
        path: "/home/{{ user }}/.config/mise"
        state: directory
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0755"

    - name: mise's configuration
      ansible.builtin.copy:
        src: files/agent/mise-config.toml
        dest: "/home/{{ user }}/.config/mise/config.toml"
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0644"

    # npm (and mise's npm backend) fetch packages from the cache's npm remote.
    - name: npm registry, through the cache
      ansible.builtin.copy:
        dest: "/home/{{ user }}/.npmrc"
        content: "registry={{ lan_cache }}/npm/npm/\n"
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0644"

    - name: mise in the owner's shell
      ansible.builtin.lineinfile:
        path: "/home/{{ user }}/.bashrc"
        line: 'eval "$(mise activate bash)"'
        create: true
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0644"

    - name: Install Node and the harnesses with mise
      ansible.builtin.command: mise install --yes
      become_user: "{{ user }}"
      environment:
        HOME: "/home/{{ user }}"
      register: mise_install
      changed_when: mise_install.stderr is not search('installed 0 tools|all tools are installed')
      when: not ansible_check_mode

    # Web search for the harnesses that lack a free one of their own (owner, 2026-11-22). Claude Code, Codex,
    # omp and agy search with their own tools. pi gets pi-web-access, as on the owner's workstation: no key,
    # Exa's free MCP endpoint first and a chain of other providers after it. OpenCode 2 gets its built-in
    # search on `random`, which keeps one free provider until it is rate limited and then switches, allowed
    # without a prompt so a run with no one to answer can search (opencode.ai/config.json). Hermes needs no
    # file: its keyless ring rotates across free tiers (agents/journal/2026-11-22-web-search-agent-1.md).
    - name: pi's web search package
      ansible.builtin.command: pi install npm:pi-web-access
      args:
        creates: "/home/{{ user }}/.pi/agent/npm/node_modules/pi-web-access"
      become_user: "{{ user }}"
      environment:
        HOME: "/home/{{ user }}"
        PATH: "/home/{{ user }}/.local/share/mise/shims:/usr/local/bin:/usr/bin:/bin"
      when: not ansible_check_mode

    - name: OpenCode's configuration folder
      ansible.builtin.file:
        path: "/home/{{ user }}/.config/opencode"
        state: directory
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0755"

    - name: OpenCode's web search
      ansible.builtin.copy:
        src: files/agent/opencode.json
        dest: "/home/{{ user }}/.config/opencode/opencode.json"
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0644"

    # Keeps the "latest" tools current; the harnesses' own updaters do not work in mise's install folders.
    - name: mise upgrade timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - name: mise-upgrade.service
          content: |
            [Unit]
            Description=Upgrade the owner's mise tools (ansible/agent.yml)
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=oneshot
            User={{ user }}
            Environment=HOME=/home/{{ user }}
            ExecStart=/usr/bin/mise upgrade --yes
        - name: mise-upgrade.timer
          content: |
            [Unit]
            Description=Daily mise upgrade for the owner's tools

            [Timer]
            OnCalendar=daily
            RandomizedDelaySec=1h
            Persistent=true

            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"
      register: mise_timer

    - name: Run the mise upgrade timer
      ansible.builtin.systemd_service:
        name: mise-upgrade.timer
        state: started
        enabled: true
        daemon_reload: "{{ mise_timer is changed }}"

    # A keyring for harnesses that keep their sign-in in the system's secret store (the Secret Service over
    # D-Bus), as agy does; without one it fails with "secret keyring is locked" (its troubleshooting page). A
    # headless VM has no login to unlock a keyring with, so this one is unencrypted: its secrets are a 0600 file
    # in the owner's home folder, like the logins Claude Code and Codex keep in their own files. Both are
    # credentials, and agent-1's backup is treated like one (plan, B0).
    - name: The keyring and its command-line tool
      ansible.builtin.apt:
        name: [gnome-keyring, libsecret-tools]
        install_recommends: false

    - name: The owner's keyring folder
      ansible.builtin.file:
        path: "/home/{{ user }}/.local/share/keyrings"
        state: directory
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0700"

    # Written once: the daemon adds the secrets to this file, so a later run must not replace it.
    - name: An unencrypted login keyring, the default
      ansible.builtin.copy:
        dest: "/home/{{ user }}/.local/share/keyrings/{{ item.name }}"
        content: "{{ item.content }}"
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0600"
        force: false
      loop:
        - name: login.keyring
          content: |
            [keyring]
            display-name=login
            ctime=0
            mtime=0
            lock-on-idle=false
            lock-after=false
        - name: default
          content: login
      loop_control:
        label: "{{ item.name }}"

    # The Antigravity CLI (agy), through the cache's `antigravity` remote; files/agent/agy-update.sh installs it
    # and agy-update.timer keeps it current. agy's own updater is off, in the shell here and in the Orca
    # server's service below.
    - name: The Antigravity CLI installer and updater
      ansible.builtin.copy:
        src: files/agent/agy-update.sh
        dest: /usr/local/sbin/agy-update
        mode: "0755"

    - name: Install the Antigravity CLI
      ansible.builtin.command: /usr/local/sbin/agy-update
      args:
        creates: /usr/local/bin/agy
      when: not ansible_check_mode

    - name: agy's own updater off in the owner's shell
      ansible.builtin.lineinfile:
        path: "/home/{{ user }}/.bashrc"
        line: export AGY_CLI_DISABLE_AUTO_UPDATE=true
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0644"

    - name: agy update timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - name: agy-update.service
          content: |
            [Unit]
            Description=Update the Antigravity CLI to Google's latest release (ansible/agent.yml)
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/agy-update
        - name: agy-update.timer
          content: |
            [Unit]
            Description=Daily update of the Antigravity CLI

            [Timer]
            OnCalendar=daily
            RandomizedDelaySec=1h
            Persistent=true

            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"
      register: agy_timer

    - name: Run the agy update timer
      ansible.builtin.systemd_service:
        name: agy-update.timer
        state: started
        enabled: true
        daemon_reload: "{{ agy_timer is changed }}"
      # In --check the timer above is not written yet.
      ignore_errors: "{{ ansible_check_mode }}"

    # The Orca server (agents/plans/home-overhaul.md, B0): Orca's server-only build, so workers start here from
    # the owner's Orca (`orchestration worker-start --on agent-1`) and keep running while his laptop sleeps.
    # Orca's own install (docs/site/content/docs/remote-servers.mdx, "Install only the server on Linux"), with
    # one folder per release under /opt/orca-server and `current` pointing at the one in use. This pinned release
    # is only the first install; files/agent/orca-server-update.sh keeps it on the latest after that.
    - name: Is the Orca server installed
      ansible.builtin.stat:
        path: /opt/orca-server/current
      register: orca_current

    - name: Install the Orca server {{ orca_version }}
      when: not orca_current.stat.exists
      block:
        - name: Download the Orca server {{ orca_version }}
          ansible.builtin.get_url:
            url: "{{ lan_cache }}/general/github-releases/stablyai/orca/releases/download/v{{ orca_version }}/orca-server-linux-x64.tar.gz"
            dest: "/var/cache/orca-server-{{ orca_version }}-linux-x64.tar.gz"
            checksum: "sha256:{{ orca_sha256 }}"
            mode: "0644"
            timeout: 300

        - name: The Orca server's release folder
          ansible.builtin.file:
            path: "/opt/orca-server/{{ orca_version }}"
            state: directory
            mode: "0755"

        - name: Unpack the Orca server {{ orca_version }}
          ansible.builtin.unarchive:
            src: "/var/cache/orca-server-{{ orca_version }}-linux-x64.tar.gz"
            dest: "/opt/orca-server/{{ orca_version }}"
            remote_src: true
            extra_opts: [--strip-components=1]
          # In --check the folder above is not created yet.
          ignore_errors: "{{ ansible_check_mode }}"

        - name: Point current at {{ orca_version }}
          ansible.builtin.file:
            src: "{{ orca_version }}"
            dest: /opt/orca-server/current
            state: link
          ignore_errors: "{{ ansible_check_mode }}"

    # No GNOME screen reader on this VM, so `orca` is free; Orca's skills and docs use both names.
    - name: orca and orca-ide on everyone's PATH
      ansible.builtin.file:
        src: /opt/orca-server/current/bin/orca-ide
        dest: "/usr/local/bin/{{ item }}"
        state: link
        force: true
      loop: [orca, orca-ide]
      ignore_errors: "{{ ansible_check_mode }}"

    # The server runs as a systemd user service, which stops at logout unless lingering is on (Orca's docs).
    - name: Keep the owner's user services running without a login
      ansible.builtin.command: loginctl enable-linger {{ user }}
      args:
        creates: "/var/lib/systemd/linger/{{ user }}"

    - name: The owner's user id, for the user services below
      ansible.builtin.getent:
        database: passwd
        key: "{{ user }}"

    - name: Remember the owner's user id
      ansible.builtin.set_fact:
        orca_uid: "{{ ansible_facts['getent_passwd'][user][1] }}"

    # A desktop on demand (agents/plans/home-overhaul.md, B0; owner, 2026-11-22): one TigerVNC display (:1)
    # with Xfce, so the owner can watch an agent or take over. It runs only when used: a connection to port
    # 5901 starts it through systemd-socket-proxyd, which hands the connection to Xvnc on localhost and exits
    # after 30 idle minutes, taking the desktop with it. An agent that needs a screen runs
    # `systemctl --user start desktop` and uses DISPLAY=:1. TLS plus the VNC password, which is in OpenBao
    # (kv/homelab/agent-1-vnc); agent-1 has only LAN and tailnet addresses.
    - name: The desktop's packages
      ansible.builtin.apt:
        name:
          - tigervnc-standalone-server
          - tigervnc-tools
          - xfce4-session
          - xfwm4
          - xfce4-panel
          - xfdesktop4
          - xfce4-terminal
          - thunar
          - dbus-x11
        install_recommends: false

    - name: The owner's VNC folder
      ansible.builtin.file:
        path: "/home/{{ user }}/.vnc"
        state: directory
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0700"

    - name: The VNC password, from OpenBao
      ansible.builtin.shell: >-
        set -o pipefail &&
        printf '%s' "$VNC_PASSWORD" | vncpasswd -f > /home/{{ user }}/.vnc/passwd.new &&
        if cmp -s /home/{{ user }}/.vnc/passwd.new /home/{{ user }}/.vnc/passwd;
        then rm /home/{{ user }}/.vnc/passwd.new; echo same;
        else mv /home/{{ user }}/.vnc/passwd.new /home/{{ user }}/.vnc/passwd; fi
      args:
        executable: /bin/bash
      environment:
        VNC_PASSWORD: "{{ lookup('pipe', 'bao kv get -mount=kv -field=password homelab/agent-1-vnc') }}"
      become_user: "{{ user }}"
      register: vnc_passwd
      changed_when: vnc_passwd.stdout != 'same'
      no_log: true
      when: not ansible_check_mode

    - name: The desktop's user units
      ansible.builtin.copy:
        dest: "/home/{{ user }}/.config/systemd/user/{{ item.name }}"
        content: "{{ item.content }}"
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0644"
      loop:
        - name: desktop.service
          content: |
            # Written by ansible/agent.yml. Xvnc on localhost only; vnc-proxy.socket is the way in.
            [Unit]
            Description=Desktop on display :1 (Xvnc and Xfce)

            [Service]
            ExecStart=/bin/sh -c 'Xvnc :1 -rfbport 5911 -localhost=1 -SecurityTypes TLSVnc -PasswordFile %h/.vnc/passwd -geometry 1600x900 -depth 24 & for i in $(seq 50); do [ -S /tmp/.X11-unix/X1 ] && break; sleep 0.2; done; exec env DISPLAY=:1 dbus-launch --exit-with-session startxfce4'
            KillMode=control-group
        - name: vnc-proxy.socket
          content: |
            # Written by ansible/agent.yml. A connection here starts the desktop.
            [Unit]
            Description=VNC on port 5901, starting the desktop on demand

            [Socket]
            ListenStream=5901

            [Install]
            WantedBy=sockets.target
        - name: vnc-proxy.service
          content: |
            # Written by ansible/agent.yml.
            [Unit]
            Description=Hand VNC connections to the desktop's Xvnc
            Requires=desktop.service
            After=desktop.service

            [Service]
            ExecStartPre=/bin/sh -c 'for i in $(seq 100); do ss -ltn | grep -q "127.0.0.1:5911 " && exit 0; sleep 0.2; done; exit 1'
            ExecStart=/usr/lib/systemd/systemd-socket-proxyd --exit-idle-time=30min 127.0.0.1:5911
            ExecStopPost=/usr/bin/systemctl --user --no-block stop desktop.service
      loop_control:
        label: "{{ item.name }}"
      register: desktop_units

    - name: Listen for VNC connections
      ansible.builtin.systemd_service:
        name: vnc-proxy.socket
        scope: user
        state: started
        enabled: true
        daemon_reload: "{{ desktop_units is changed }}"
      become_user: "{{ user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ orca_uid }}"
      when: not ansible_check_mode

    # Orca writes and owns the unit (orca-serve.service: `orca serve --supervise --no-pairing`). It listens on all
    # interfaces, so the tailnet can reach it once agent-1 joins, and --refuse-public turns away public
    # addresses. The pairing address goes into pairing links only.
    - name: The Orca server's service
      ansible.builtin.command: >-
        /opt/orca-server/current/bin/orca-ide serve service install
        --command /opt/orca-server/current/bin/orca-ide
        --port 6768 --refuse-public --pairing-address {{ ansible_facts['default_ipv4']['address'] }}
      args:
        creates: "/home/{{ user }}/.config/systemd/user/orca-serve.service"
      become_user: "{{ user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ orca_uid }}"
      when: not ansible_check_mode

    - name: The Orca server's settings folder
      ansible.builtin.file:
        path: "/home/{{ user }}/.config/systemd/user/orca-serve.service.d"
        state: directory
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0755"

    # Orca's unit sets PATH to the system folders only, which hides the harnesses mise installs; and nothing caps
    # a terminal's memory by default, so one runaway job could take the whole 4 GiB VM into the OOM killer
    # (remote-servers.mdx, "Limit terminal memory on a Linux server"). 3G is a first guess, not measured.
    - name: The Orca server's PATH and terminal memory limits
      ansible.builtin.copy:
        dest: "/home/{{ user }}/.config/systemd/user/orca-serve.service.d/agent.conf"
        content: |
          # Written by ansible/agent.yml.
          [Service]
          Environment=PATH=/home/{{ user }}/.local/share/mise/shims:/home/{{ user }}/.local/bin:/usr/local/bin:/usr/bin:/bin
          Environment=ORCA_TERMINAL_MEMORY_MAX=3G
          Environment=ORCA_TERMINAL_MEMORY_SWAP_MAX=0
          Environment=AGY_CLI_DISABLE_AUTO_UPDATE=true
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0644"
      register: orca_dropin

    - name: Run the Orca server
      ansible.builtin.systemd_service:
        name: orca-serve.service
        scope: user
        state: "{{ 'restarted' if orca_dropin is changed else 'started' }}"
        enabled: true
        daemon_reload: "{{ orca_dropin is changed }}"
      become_user: "{{ user }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ orca_uid }}"
      when: not ansible_check_mode

    - name: The Orca server updater
      ansible.builtin.copy:
        src: files/agent/orca-server-update.sh
        dest: /usr/local/sbin/orca-server-update
        mode: "0755"

    # Every 6 hours, so agent-1 is at most a few hours behind the owner's desktop and phone.
    - name: Orca server update timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - name: orca-server-update.service
          content: |
            [Unit]
            Description=Update the Orca server to Orca's latest release (ansible/agent.yml)
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/orca-server-update
        - name: orca-server-update.timer
          content: |
            [Unit]
            Description=Check for a new Orca server release every 6 hours

            [Timer]
            OnCalendar=00/6:00
            RandomizedDelaySec=30min
            Persistent=true

            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"
      register: orca_timer

    - name: Run the Orca server update timer
      ansible.builtin.systemd_service:
        name: orca-server-update.timer
        state: started
        enabled: true
        daemon_reload: "{{ orca_timer is changed }}"
      # In --check the timer above is not written yet.
      ignore_errors: "{{ ansible_check_mode }}"
