# Artifact Keeper on cache-1 (plans/package-and-image-cache.md). Run from ansible/
# after common.yml and xcpng.yml:
#   ansible-playbook cache.yml --check --diff      # read this first
#   ansible-playbook cache.yml
# then create the repositories: ../apps/homeserver/artifact-keeper/cache-remotes.sh
#
# Secrets are read from OpenBao on this machine (kv/homelab/artifact-keeper) and
# written to cache-1 as files the stack mounts; they never appear in the output.
- name: Artifact Keeper on cache-1
  hosts: cache-1
  become: true
  vars:
    stack_src: "{{ playbook_dir }}/../apps/homeserver/artifact-keeper"
    stack_dir: /opt/artifact-keeper
    data_dir: /srv/artifact-keeper
    secret: "bao kv get -mount=kv -field=FIELD homelab/artifact-keeper"
    lab_zone: "{{ lookup('pipe', 'bao kv get -mount=kv -field=zone general/cloudflare') }}"
    authentik_domain: "{{ lookup('pipe', 'bao kv get -mount=kv -field=domain general/authentik') }}"
  tasks:
    # Debian 13's own Docker 26.1.5 and Compose 2.26.1 (apt-cache policy on
    # cache-1, 2026-11-16), so no extra apt repository is needed.
    - name: Install Docker and Compose from Debian
      ansible.builtin.apt:
        name: [docker.io, docker-compose]
        update_cache: true
        cache_valid_time: 3600

    - name: Data folders the backend writes (its image runs as uid 1001, group 0)
      ansible.builtin.file:
        path: "{{ data_dir }}/{{ item }}"
        state: directory
        owner: "1001"
        group: "0"
        mode: "0770"
      loop: [storage, backups, plugins]

    - name: Monitoring data folders, owned by each image's user
      ansible.builtin.file:
        path: "{{ data_dir }}/{{ item.name }}"
        state: directory
        owner: "{{ item.uid }}"
        group: "{{ item.uid }}"
        mode: "0750"
      loop:
        - { name: prometheus, uid: "65534" }
        - { name: grafana, uid: "472" }

    - name: PostgreSQL's data folder (the image sets up its own subfolder)
      ansible.builtin.file:
        path: "{{ data_dir }}/postgres"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Stack folder and its secrets folder
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ stack_dir }}", mode: "0755" }
        - { path: "{{ stack_dir }}/secrets", mode: "0700" }

    - name: Stack files from apps/homeserver/artifact-keeper
      ansible.builtin.copy:
        src: "{{ stack_src }}/{{ item.name }}"
        dest: "{{ stack_dir }}/{{ item.name }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { name: compose.yaml, mode: "0644" }
        - { name: Caddyfile, mode: "0644" }
        - { name: init-pg-ssl.sh, mode: "0755" }
        - { name: prometheus.yml, mode: "0644" }
      register: stack_files

    # Grafana's data source and dashboard, provisioned from the repo.
    - name: Grafana files from apps/homeserver/artifact-keeper/grafana
      ansible.builtin.copy:
        src: "{{ stack_src }}/grafana"
        dest: "{{ stack_dir }}/"
        owner: root
        group: root
        mode: u=rwX,go=rX
      register: grafana_files

    # The folder above is root-only; the files are world-readable because each
    # container reads its own as a non-root user (PostgreSQL as 70, the backend
    # as 1001), and a mounted file keeps its permissions.
    - name: Secret files from OpenBao
      ansible.builtin.copy:
        dest: "{{ stack_dir }}/secrets/{{ item.name }}"
        content: "{{ item.value }}"
        owner: root
        group: root
        mode: "0444"
      loop:
        - name: db_password
          value: "{{ lookup('pipe', secret | replace('FIELD', 'db_password')) }}"
        - name: jwt_secret
          value: "{{ lookup('pipe', secret | replace('FIELD', 'jwt_secret')) }}"
        - name: admin_password
          value: "{{ lookup('pipe', secret | replace('FIELD', 'admin_password')) }}"
        - name: grafana_admin_password
          value: "{{ lookup('pipe', secret | replace('FIELD', 'grafana_admin_password')) }}"
        - name: oidc_client_secret
          value: "{{ lookup('pipe', secret | replace('FIELD', 'oidc_client_secret')) }}"
        - name: grafana_oidc_client_secret
          value: "{{ lookup('pipe', secret | replace('FIELD', 'grafana_oidc_client_secret')) }}"
        - name: database_url
          value: "postgresql://registry:{{ lookup('pipe', secret | replace('FIELD', 'db_password')) }}@postgres:5432/artifact_registry?sslmode=require"
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      register: stack_secrets

    # The values compose.yaml fills in (.env.example lists them). Not secrets,
    # but the zone stays out of the public repo. `compose up` recreates every
    # container whose settings change with it.
    - name: Compose variables from OpenBao
      ansible.builtin.copy:
        dest: "{{ stack_dir }}/.env"
        content: |
          LAB_ZONE={{ lab_zone }}
          AUTHENTIK_DOMAIN={{ authentik_domain }}
          AK_OIDC_CLIENT_ID={{ lookup('pipe', secret | replace('FIELD', 'oidc_client_id')) }}
          GRAFANA_OIDC_CLIENT_ID={{ lookup('pipe', secret | replace('FIELD', 'grafana_oidc_client_id')) }}
        owner: root
        group: root
        mode: "0600"

    - name: Start or update the stack
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ stack_dir }}"
      register: compose_up
      changed_when: compose_up.stderr is search('(Creat|Recreat|Start|Pull)(ed|ing)')
      when: not ansible_check_mode

    # `compose up` only recreates a container whose own definition changed; a
    # mounted config file that changed needs a restart of the one reading it.
    - name: Restart what reads a changed config file
      ansible.builtin.command:
        cmd: "docker compose restart {{ item.service }}"
        chdir: "{{ stack_dir }}"
      loop:
        - service: caddy
          changed: "{{ stack_files.results | selectattr('item.name', 'eq', 'Caddyfile') | selectattr('changed') | list | length > 0 }}"
        - service: prometheus
          changed: "{{ stack_files.results | selectattr('item.name', 'eq', 'prometheus.yml') | selectattr('changed') | list | length > 0 }}"
        - service: grafana
          changed: "{{ grafana_files.changed }}"
      loop_control:
        label: "{{ item.service }}"
      when: item.changed | bool and not ansible_check_mode
