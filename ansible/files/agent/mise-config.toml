# The owner's mise configuration on agent-1 (~aman/.config/mise/config.toml), written by ansible/agent.yml.
# Every download goes through the LAN cache on cache-1 (apps/homeserver/artifact-keeper/remotes.txt):
# Node from the `nodejs` remote, npm packages from the `npm` remote (~/.npmrc). That is why the harnesses
# use their npm packages here, not mise's default backends, which download from GitHub releases or a
# vendor's server (the owner's workstation uses those, `mise registry <tool>`, 2026-11-22).
#
# "latest" is resolved on the first install and moved forward by the daily `mise upgrade` timer
# (agent.yml, "mise upgrade timer").

[settings]
node.mirror_url = "http://10.22.33.137/general/nodejs/"
npm.package_manager = "npm"

[tools]
# The current LTS line, as on the owner's workstation (26.8.2 there, 2026-11-22).
node = "26"
# These ship their program as a platform package that their own postinstall script puts in place.
# mise runs npm with --ignore-scripts unless a package is approved (allow_builds, npm 11.16 or later; mise's
# docs/dev-tools/backends/npm.md, v2026.11.12), so each approves only its own package.
"npm:@anthropic-ai/claude-code" = { version = "latest", allow_builds = ["@anthropic-ai/claude-code"] }
"npm:@openai/codex" = { version = "latest", allow_builds = ["@openai/codex"] }
# OpenCode 2 (`@opencode/cli`, both `opencode` and `opencode2`), as on the owner's workstation (owner,
# 2026-11-22); it replaced OpenCode 1 (`opencode-ai`). Orca lists the two as separate agents.
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
"npm:@earendil-works/pi-coding-agent" = "latest"
# oh-my-pi runs on Bun (its package's engines field). Bun from npm, whose own postinstall puts its binary in
# place, so it too comes through the cache's npm remote; mise's `bun` backend downloads from GitHub instead.
"npm:bun" = { version = "latest", allow_builds = ["bun"] }
"npm:@oh-my-pi/pi-coding-agent" = "latest"
# DeepSeek Harness, as on the owner's workstation (owner, 2026-11-22). Every release so far is a
# prerelease (npm's `latest` tag was 0.2.2-rc.5 on 2026-11-22), which mise skips unless this tool allows
# them; the package has no install script.
"npm:@deepseek-ai/dsh" = { version = "latest", prerelease = true }
"npm:playwright" = "latest"
# The owner's fleet research toolchain, as on his workstation (versions read there 2026-11-22: deno 2.9.8,
# rustc 1.100.0, uv 0.13.9, pnpm 12.14.0, Java 21). These come from each project's own release servers
# (mise's default backends), except pnpm, which comes through the cache's npm remote. Java comes from
# Debian instead (agent.yml): mise's Temurin downloads from GitHub, which the router's tailnet detour
# slowed to about 60 KB/s on 2026-11-22.
deno = "2"
rust = "1.100"
uv = "0.13"
"npm:pnpm" = "12"
