# Short names only for tailnet hosts: they resolve over the tailnet, so the tailnet's
# own name and addresses stay out of this public repo. LAN hosts use their LAN address
# (inventory/network.md); from outside the LAN it is reached through the router's
# subnet route.
all:
  children:
    oci:
      hosts:
        pigsty-1:
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/pigsty
    oob:
      hosts:
        oob-1:
          ansible_host: 10.22.33.252
          ansible_user: aman
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
