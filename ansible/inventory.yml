# Short names only for tailnet hosts: they resolve over the tailnet, so the tailnet's
# own name and addresses stay out of this public repo. LAN hosts use their LAN address
# (lab/inventory/network.md); from outside the LAN it is reached through the router's
# subnet route.
all:
  children:
    oci:
      hosts:
        pigsty-1:
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/pigsty
    oob:
      hosts:
        oob-1:
          ansible_host: 10.22.33.252
          ansible_user: aman
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
    # VMs on the XCP-ng host (ansible/xcpng.yml). All use the homelab VM key
    # (kv/general/vm-ssh); cache-1, proxy-1 and agent-1 are built by OpenTofu (iac/).
    xcpng:
      vars:
        ansible_ssh_private_key_file: ~/.ssh/homelab_vm
      hosts:
        xo-ce:
          ansible_host: 10.22.33.100
          ansible_user: xo
        cache-1:
          ansible_host: 10.22.33.137
          ansible_user: debian
        proxy-1:
          ansible_host: 10.22.33.138
          ansible_user: debian
        agent-1:
          ansible_host: 10.22.33.139
          ansible_user: debian
    # The LAN cache rule (ansible/README.md, "Adding a host"): every host in
    # `xcpng` is in exactly one of these two groups, checked by
    # .githooks/check-cache-clients.py on every commit and in CI.
    lan_cache_clients:
      # apt and Docker through cache-1 (cache-client.yml).
      hosts:
        proxy-1:
        agent-1:
    lan_cache_exempt:
      # Each with its reason.
      hosts:
        cache-1: # it is the cache; it must not depend on itself
        xo-ce: # an old VM, to be replaced (owner, 2026-11-17); updated through the cache by hand once
