# Artifact Keeper: the LAN's package and image cache, on cache-1
# (plans/package-and-image-cache.md). Trimmed from the project's own
# docker-compose.yml at commit 825b75e9 to the four services a pull-through
# cache needs; search (OpenSearch), scanners (Trivy, OpenSCAP) and
# Dependency-Track are left out, which the backend allows when their URLs are
# unset (tested 2026-11-15, plan "Local test").
#
# Deployed by ansible/cache.yml into /opt/artifact-keeper, with the secret files
# it writes into ./secrets/ from OpenBao (kv/homelab/artifact-keeper). Data is on
# bind mounts under /srv/artifact-keeper (owner, 2026-11-16).
name: artifact-keeper

services:
  # Self-signed certificates so the backend talks to PostgreSQL over TLS, as
  # upstream does. Runs once; skips when the certificates exist.
  pg-certs:
    image: docker.io/library/alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /certs/server.crt ]; then
          echo "pg-certs: certificates already exist, skipping"
          exit 0
        fi
        apk add --no-cache openssl >/dev/null 2>&1
        openssl genrsa -out /certs/ca.key 4096
        openssl req -x509 -new -nodes -key /certs/ca.key -sha256 -days 3650 \
          -out /certs/ca.crt -subj "/CN=cache-1 PostgreSQL CA"
        openssl genrsa -out /certs/server.key 2048
        openssl req -new -key /certs/server.key -out /certs/server.csr -subj "/CN=postgres"
        printf 'basicConstraints=CA:FALSE\nsubjectAltName=DNS:postgres,DNS:localhost\n' > /certs/server.ext
        openssl x509 -req -in /certs/server.csr -CA /certs/ca.crt -CAkey /certs/ca.key \
          -CAcreateserial -out /certs/server.crt -days 3650 -sha256 -extfile /certs/server.ext
        rm -f /certs/server.csr /certs/server.ext /certs/ca.srl
        chown 70:70 /certs/server.key /certs/server.crt /certs/ca.crt
        chmod 600 /certs/server.key
        chmod 644 /certs/server.crt /certs/ca.crt
    volumes:
      - pg_certs:/certs
    restart: "no"

  postgres:
    image: docker.io/library/postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    depends_on:
      pg-certs:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: registry
      POSTGRES_DB: artifact_registry
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      # PostgreSQL 18 keeps PGDATA in a subfolder of this mount (upstream note).
      - /srv/artifact-keeper/postgres:/var/lib/postgresql
      - ./init-pg-ssl.sh:/docker-entrypoint-initdb.d/init-pg-ssl.sh:ro
      - pg_certs:/var/lib/postgresql/certs:ro
    # Not published: only the backend talks to it, on this network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d artifact_registry"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    # `main`, pinned by digest (owner, 2026-11-16): the per-remote byte cap is
    # only in `main`; the newest release, v1.11.13, lacks it. Built 2026-11-16
    # from upstream revision aee5068f. Moves to a release that carries the cap
    # (plan step 6), with a VM snapshot first.
    image: ghcr.io/artifact-keeper/artifact-keeper-backend:main@sha256:9cacff074a69af43df5e97b0b74b9fd63b47798d55e7567610006f2a0aea81fb
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Secrets come from files, so they stay out of `docker inspect`.
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      # ADMIN_PASSWORD (not INITIAL_ADMIN_PASSWORD) creates the admin without
      # the first-login password change, so cache-remotes.sh can log in.
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      STORAGE_PATH: /data/storage
      BACKUP_PATH: /data/backups
      PLUGINS_DIR: /data/plugins
      RUST_LOG: info
      CORS_ORIGINS: http://10.22.33.137,https://cache.home.${LAB_ZONE:?}
      # The name behind the home proxy (apps/homeserver/traefik/). The OIDC
      # callback is built from it, so it must be the https:// name.
      AK_EXTERNAL_URL: https://cache.home.${LAB_ZONE:?}
      # Sign-in through Authentik (OIDC), seeded from these on every boot;
      # removing them and restarting disables the provider again and leaves
      # the local admin, which stays for when Authentik is unreachable.
      # Authentik users in `homelab-admins` become admins here.
      OIDC_NAME: authentik
      OIDC_ISSUER: https://${AUTHENTIK_DOMAIN:?}/application/o/artifact-keeper/
      OIDC_CLIENT_ID: ${AK_OIDC_CLIENT_ID:?}
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      OIDC_SCOPES: openid profile email
      OIDC_USERNAME_CLAIM: preferred_username
      OIDC_ADMIN_GROUP: homelab-admins
      # Caddy's network below; upstream explains why this must match it.
      RATE_LIMIT_TRUSTED_PROXY_CIDRS: 172.30.0.0/24
      # Docker daemons using this cache as `registry-mirrors` send image paths
      # without a repository key; they land in this remote (tested 2026-11-15).
      AK_DEFAULT_DOCKER_MIRROR_REPO: dockerhub
      # Anonymous reads, for the remotes marked public (cache-remotes.sh) only;
      # writes and admin routes always need a login (source reviews, plan).
      AK_GUEST_ACCESS_ENABLED: "true"
      # The hard limit across all repositories, 80 GB on the 100 GB disk
      # (owner, 2026-11-16). At it, remotes still answer but store nothing new;
      # nothing is evicted by it. Per-repository caps (remotes.txt) evict, and
      # cache-remotes.sh's idle rule drains (owner, 2026-11-17).
      STORAGE_QUOTA_BYTES: "80000000000"
      # A second listener serving only GET /metrics, without a login, for
      # Prometheus below. Not published: only this stack's network reaches it.
      METRICS_PORT: "9091"
      HOST: 0.0.0.0
      PORT: 8080
    secrets:
      - database_url
      - jwt_secret
      - admin_password
      - oidc_client_secret
    volumes:
      # Owned by uid 1001, group 0: the image's runtime user.
      - /srv/artifact-keeper/storage:/data/storage
      - /srv/artifact-keeper/backups:/data/backups
      - /srv/artifact-keeper/plugins:/data/plugins
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/livez"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  web:
    # Released separately from the backend; v1.11.2 was its newest on 2026-11-16.
    image: ghcr.io/artifact-keeper/artifact-keeper-web:1.11.2@sha256:c17f1bff9a8bc1646efded313c107a003c383f7c03b213b389cdf789302267a5
    depends_on:
      backend:
        condition: service_started
    environment:
      BACKEND_URL: http://backend:8080
    restart: unless-stopped

  # The only published service: plain HTTP on the LAN. apt checks package
  # signatures itself, and Docker checks image digests.
  caddy:
    image: docker.io/library/caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    depends_on:
      backend:
        condition: service_started
      web:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Monitoring (owner, 2026-11-17): the web UI shows no hit rate, so Prometheus
  # keeps the backend's counters and the VM's load, and Grafana draws them at
  # http://10.22.33.137/grafana/. Moves to the lab's central monitoring once
  # that is chosen (plans/home-overhaul.md, A6).
  prometheus:
    image: docker.io/prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A year of history, and never more than 2 GB of the disk.
      - --storage.tsdb.retention.time=365d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Owned by uid 65534 (nobody), the image's user.
      - /srv/artifact-keeper/prometheus:/prometheus
    restart: unless-stopped

  # The VM's CPU, load, memory, disk and network. Reads the host's root
  # read-only. On the host's network so it sees the VM's own interfaces, but
  # listening only on this stack's bridge address (the gateway of the network
  # below), so nothing on the LAN reaches it.
  node-exporter:
    image: docker.io/prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command:
      - --path.rootfs=/host
      - --web.listen-address=172.30.0.1:9100
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    depends_on:
      - prometheus
    environment:
      # The name behind the home proxy; the OAuth callback is built from it.
      # http://10.22.33.137/grafana/ still answers, then redirects there.
      GF_SERVER_ROOT_URL: https://cache.home.${LAB_ZONE:?}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/cache.json
      # Sign-in through Authentik (generic OAuth) only (owner, 2026-11-18): no
      # password form and no basic auth. Members of the Authentik group
      # `homelab-admins` become Grafana admins, everyone else a viewer; a
      # first sign-in creates the account. When Authentik is unreachable, set
      # both lines below to "false" and rerun cache.yml: the local `admin`
      # (kv/homelab/artifact-keeper, grafana_admin_password) still exists.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      # Straight to Authentik instead of a page with one button.
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Authentik
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:?}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /run/secrets/grafana_oidc_client_secret
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://${AUTHENTIK_DOMAIN:?}/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://${AUTHENTIK_DOMAIN:?}/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL: https://${AUTHENTIK_DOMAIN:?}/application/o/userinfo/
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups, 'homelab-admins') && 'Admin' || 'Viewer'"
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://${AUTHENTIK_DOMAIN:?}/application/o/cache-grafana/end-session/
    secrets:
      - grafana_admin_password
      - grafana_oidc_client_secret
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      # Owned by uid 472, the image's user. Holds Grafana's own database
      # (users, sessions); the dashboard and data source come from the repo.
      - /srv/artifact-keeper/grafana:/var/lib/grafana
    restart: unless-stopped

secrets:
  db_password:
    file: ./secrets/db_password
  database_url:
    file: ./secrets/database_url
  jwt_secret:
    file: ./secrets/jwt_secret
  admin_password:
    file: ./secrets/admin_password
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  grafana_oidc_client_secret:
    file: ./secrets/grafana_oidc_client_secret

volumes:
  pg_certs:
  caddy_data:
  caddy_config:

networks:
  default:
    name: artifact-keeper-network
    ipam:
      config:
        - subnet: 172.30.0.0/24
