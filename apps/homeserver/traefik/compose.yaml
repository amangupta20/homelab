# Traefik on proxy-1, the home reverse proxy (README.md here). Deployed by
# ansible/proxy.yml, which renders traefik.yml and routes/ with the lab's zone
# from OpenBao and writes the Cloudflare token as a secret file.
name: traefik

secrets:
  cf_dns_api_token:
    file: ./secrets/cf_dns_api_token
  authentik_outpost_token:
    file: ./secrets/authentik_outpost_token
  resolvr_options:
    file: ./secrets/resolvr_options

services:
  traefik:
    # Same release as the VPS's Traefik (`traefik version` there, 2026-11-18),
    # pinned by digest (Docker Hub, read 2026-11-18).
    image: docker.io/library/traefik:v3.7.16@sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # lego (Traefik's ACME client) reads any of its variables from a file
      # when the name ends in _FILE, so the token never sits in the environment.
      CF_DNS_API_TOKEN_FILE: /run/secrets/cf_dns_api_token
    secrets:
      - cf_dns_api_token
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./routes:/etc/traefik/routes:ro
      # The certificate and the ACME account key; losing it only means a new
      # certificate is requested.
      - /srv/traefik/letsencrypt:/letsencrypt
      - /srv/traefik/log:/var/log/traefik
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    networks:
      default:
      # Its own network with Resolvr, at a fixed address that Resolvr trusts (below).
      resolvr:
        ipv4_address: 172.31.250.2
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Authentik's proxy outpost for this site: Traefik's forward-auth asks it on every request to a route
  # behind Authentik (routes/dashboard.yml.j2). It connects out to Authentik's public URL with its own
  # token, and serves the sign-in callback on each protected hostname (NOTES.md, "Forward-auth").
  authentik-outpost:
    # The Authentik server's version (its API, 2026-11-21); outpost and server are upgraded together.
    # Pulled through the LAN cache's ghcr remote; the digest is ghcr.io's for this tag.
    image: 10.22.33.137/ghcr/goauthentik/proxy:2026.8.5@sha256:34640cf41e009ab052d4b9119cea816713adcd1eaac95de6caefebfe86d3fcd9
    restart: unless-stopped
    environment:
      # Written into .env by ansible/proxy.yml from OpenBao: the zone stays out of this repo.
      AUTHENTIK_HOST: "${AUTHENTIK_HOST:?}"
      AUTHENTIK_INSECURE: "false"
      # Read from the file, not the environment (Authentik's config loader takes file:// values).
      AUTHENTIK_TOKEN: file:///run/secrets/authentik_outpost_token
    secrets:
      - authentik_outpost_token
    # No published port: only Traefik, on this compose network, talks to it (port 9000).
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # traefik-log-dashboard (AGPL-3.0), a view-only dashboard of the access log: its agent parses the log and
  # serves it over an API; the dashboard below shows it at traefik-logs.home.<zone>, behind Authentik
  # (routes/traefik-logs.yml.j2, NOTES.md "Log dashboards"). Release 3.1.1, pinned by digest (Docker Hub, read
  # 2026-11-21), pulled through the LAN cache's Docker Hub mirror. Both images run as root; with every
  # capability dropped root can read only what root owns, which is the access log, and the root filesystem is read-only.
  log-agent:
    image: docker.io/hhftechnology/traefik-log-dashboard-agent:3.1.1@sha256:4c9853d486a0e3108678fd00aeda86ce1b269c0ae1b1c2ab9e5c81760e12d53a
    restart: unless-stopped
    environment:
      TRAEFIK_LOG_DASHBOARD_ACCESS_PATH: /logs/access.log
      # Traefik's own log goes to stdout (docker logs), not a file; the agent only reports it missing.
      TRAEFIK_LOG_DASHBOARD_ERROR_PATH: /logs/traefik.log
      TRAEFIK_LOG_DASHBOARD_LOG_FORMAT: json
      # Its "system" view would show this container's CPU and memory, not the VM's; off.
      TRAEFIK_LOG_DASHBOARD_SYSTEM_MONITORING: "false"
      # Without a token the agent serves the log to anyone on this network, so a missing token stops the
      # stack instead (ansible/proxy.yml writes it into .env from OpenBao).
      TRAEFIK_LOG_DASHBOARD_AUTH_TOKEN: "${LOG_AGENT_TOKEN:?}"
    volumes:
      - /srv/traefik/log:/logs:ro
      # Its read position in the log; losing it only means the log is read from the start again.
      - /srv/traefik/log-agent:/data
    # No published port: only the dashboard talks to it (port 5000).
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  log-dashboard:
    image: docker.io/hhftechnology/traefik-log-dashboard:3.1.1@sha256:f982908e6d0665fd361eeef893d50d7743be09e1c95d3a087d4f7d47a651bead
    restart: unless-stopped
    environment:
      AGENT_1_NAME: proxy-1
      AGENT_1_URL: http://log-agent:5000
      AGENT_1_TOKEN: "${LOG_AGENT_TOKEN:?}"
      # Agents come from these variables only; the UI cannot add one.
      DASHBOARD_AGENTS_ENV_ONLY: "true"
      # On by default, the dashboard sends client addresses to ipwho.is for the map. Every
      # client here is on the LAN or the tailnet, so the map would be empty anyway; off, so nothing leaves.
      GEOIP_LOOKUP_ENABLED: "false"
      SHOW_DEMO_PAGE: "false"
    volumes:
      # Its SQLite database (agent list from the variables above, alert settings); nothing to back up.
      - /srv/traefik/log-dashboard:/data
    # No published port: Traefik reaches it on this network (port 3000).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # GoAccess (MIT), the second view-only dashboard: it follows the access log and rewrites one HTML report, and
  # pushes live updates over a WebSocket (goaccess.conf). Shown at goaccess.home.<zone> behind Authentik
  # (routes/goaccess.yml.j2). Release 1.12, pinned by digest (Docker Hub, read 2026-11-21). Runs as root, with
  # no capabilities and a read-only root filesystem, like the log dashboard above.
  goaccess:
    image: docker.io/allinurl/goaccess:1.12@sha256:9e6dfd4abce94bd7c2907c1840b7b35f666587d56b24ffbb930b4782a87ea172
    restart: unless-stopped
    command: ["--config-file=/etc/goaccess/goaccess.conf", "/logs/access.log"]
    volumes:
      - ./goaccess.conf:/etc/goaccess/goaccess.conf:ro
      - /srv/traefik/log:/logs:ro
      # The report; rebuilt from the whole log on every start, so nothing to back up.
      - /srv/traefik/goaccess:/report
    # No published port: Traefik reaches the WebSocket on this network (port 7890).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Serves GoAccess's report page; GoAccess itself serves only the WebSocket. Busybox's httpd, the official image,
  # pinned by digest (Docker Hub, read 2026-11-21).
  goaccess-report:
    image: docker.io/library/busybox:1.38.0-musl@sha256:80e38f9a1b39188b8bdb28879178edb322a4402b081a9aedda1924609decd6f6
    restart: unless-stopped
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    volumes:
      - /srv/traefik/goaccess:/www:ro
    # No published port: Traefik reaches it on this network (port 8080).
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Resolvr (MIT), a dashboard for the Technitium DNS cluster (apps/homeserver/technitium/), at
  # resolvr.home.<zone> behind Authentik (routes/resolvr.yml.j2). The single-container image: the API
  # also serves the web app. Its Home Assistant add-on mode trusts requests by the connection's peer
  # address, never by a header, and signs them in as admin; here the only trusted peer is Traefik's fixed
  # address on the `resolvr` network, which nothing else joins, so passing Authentik is the sign-in
  # (NOTES.md, "Resolvr"). The add-on options file carries the Technitium URL and a view-only API token.
  # Release 1.3.2 through the LAN cache's ghcr remote, pinned by digest (ghcr.io, read 2026-11-23).
  resolvr:
    image: 10.22.33.137/ghcr/bassem-elsodany/resolvr:1.3.2@sha256:14b0175317a967db6dc5bd8df056b947432b4efed0b09650e0bd610859913c51
    restart: unless-stopped
    user: "1000:1000"
    environment:
      RESOLVR_ADDON: "true"
      ADDON_OPTIONS_FILE: /run/secrets/resolvr_options
      TRUSTED_INGRESS_IPS: 172.31.250.2
      COOKIE_SECURE: "true"
      # Seed accounts on first start; nobody signs in with them (see above), so their passwords are random.
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "${RESOLVR_SEED_PASSWORD:?}"
      VIEWER_USERNAME: viewer
      VIEWER_PASSWORD: "${RESOLVR_SEED_PASSWORD:?}"
    secrets:
      - resolvr_options
    volumes:
      # Its SQLite database: Resolvr's own users and sessions; nothing to back up.
      - /srv/traefik/resolvr:/app/data
    networks:
      - resolvr
    # No published port: only Traefik reaches it, on the resolvr network (port 8787).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  resolvr:
    ipam:
      config:
        - subnet: 172.31.250.0/29

