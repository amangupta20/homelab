# Rotation of Traefik's access log on proxy-1, installed by ansible/proxy.yml as /etc/logrotate.d/traefik.
# Debian's logrotate timer runs it daily (NOTES.md, "Log dashboards").
/srv/traefik/log/access.log {
    # Weekly, or sooner once it passes 50 MB (about 0.4 MB a day on 2026-11-21, so weekly is the usual case).
    weekly
    maxsize 50M
    # Eight weeks of history, compressed; the newest rotated file stays plain for a week.
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    # Copy, then truncate in place: the file never disappears, so GoAccess (which exits if the log is missing)
    # and the log dashboard's agent keep reading by name, and Traefik needs no signal. Traefik opens the log with
    # O_APPEND (pkg/middlewares/accesslog/logger.go), so it writes from the start again after the truncate.
    # Lines written between the copy and the truncate are lost.
    copytruncate
    su root root
}
