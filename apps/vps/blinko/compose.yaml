# Blinko: a note-taking app, run to test the shared Postgres (plans/shared-postgres.md).
# Public, behind its own login (owner's choice, 2026-11-07), on its own database on pigsty-1.
# Source of the shape and what differs: README.

services:
  blinko:
    # Pinned, not `latest`. arm64 checked with `docker buildx imagetools inspect`, 2026-11-06.
    image: blinkospace/blinko:1.8.9
    restart: unless-stopped
    # No published port: Dokploy's Traefik is the only way in, through the domain set in Dokploy.
    expose:
      - "1111"
    volumes:
      # Uploads. The notes themselves are in Postgres.
      - blinko-data:/app/.blinko
    # Stops after 10 minutes without traffic, and starts on the next request (plans/sablier-wakeups.md).
    # The Dokploy domain names blinko-sablier@docker. A list, because Dokploy appends its own labels.
    labels:
      - sablier.enable=true
      - sablier.group=blinko
      - traefik.docker.allownonrunning=true
      - traefik.http.middlewares.blinko-sablier.plugin.sablier.sablierUrl=http://sablier:10000
      - traefik.http.middlewares.blinko-sablier.plugin.sablier.group=blinko
      - traefik.http.middlewares.blinko-sablier.plugin.sablier.sessionDuration=10m
      - traefik.http.middlewares.blinko-sablier.plugin.sablier.failOpen=true
      - traefik.http.middlewares.blinko-sablier.plugin.sablier.dialTimeout=2s
      # Holds the request instead of showing a waiting page, so API clients get real data.
      - traefik.http.middlewares.blinko-sablier.plugin.sablier.blocking.timeout=2m
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: "https://${BLINKO_DOMAIN:?}"
      NEXT_PUBLIC_BASE_URL: "https://${BLINKO_DOMAIN:?}"
      NEXTAUTH_SECRET: "${BLINKO_NEXTAUTH_SECRET:?}"
      # Through Pigsty's service port 5433, so it follows the primary in phase 2.
      DATABASE_URL: "${BLINKO_DATABASE_URL:?}"
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 first here and the app listens on
      # IPv4 only. Traefik drops an unhealthy container, so a failing check means a 404.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:1111/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      # Checks often while starting, so a wake is not held back by the 30 s interval.
      start_interval: 5s

volumes:
  blinko-data:
