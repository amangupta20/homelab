# CloudBeaver: a web UI for the shared Postgres (agents/plans/shared-postgres.md, "Database UIs").
# Tailnet only: Traefik refuses any client outside the tailnet range. Source of the shape: README.

services:
  cloudbeaver:
    # Pinned, not `latest`. arm64 listed on Docker Hub, 2026-11-09.
    image: dbeaver/cloudbeaver:26.2.4
    restart: unless-stopped
    environment:
      # First-start setup without the wizard (CBApplication.performAutoConfiguration). The admin account is
      # CloudBeaver's own; database logins are separate.
      CB_SERVER_NAME: "CloudBeaver"
      CB_ADMIN_NAME: "${CLOUDBEAVER_ADMIN_NAME:?}"
      CB_ADMIN_PASSWORD: "${CLOUDBEAVER_ADMIN_PASSWORD:?}"
    volumes:
      # Its settings, users and saved connections. No database data.
      - cloudbeaver-workspace:/opt/cloudbeaver/workspace
    expose:
      - "8978"
    healthcheck:
      # The image has no curl, wget or nc; bash's /dev/tcp checks the port. Sablier's wake waits for this.
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8978"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 3s
    labels:
      - traefik.enable=true
      # Asleep when idle (agents/plans/sablier-wakeups.md): stopped after 30 minutes without requests, started on the next.
      - sablier.enable=true
      - sablier.group=cloudbeaver
      - traefik.docker.allownonrunning=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.cloudbeaver.rule=Host(`${CLOUDBEAVER_HOST:?}`)
      - traefik.http.routers.cloudbeaver.entrypoints=websecure
      # The allowlist runs first, so nobody outside the tailnet can wake it; then Authentik's sign-in, so nobody
      # without it can either (README, "Sign-in").
      - traefik.http.routers.cloudbeaver.middlewares=cloudbeaver-tailnet,cloudbeaver-authentik,cloudbeaver-sablier
      # The zone's wildcard certificate, over DNS-01 (lab/systems/vps.md, "Certificates").
      - traefik.http.routers.cloudbeaver.tls.certresolver=cloudflare
      - traefik.http.routers.cloudbeaver.tls.domains[0].main=${ZONE:?}
      - traefik.http.routers.cloudbeaver.tls.domains[0].sans=*.${ZONE:?}
      - traefik.http.routers.cloudbeaver.service=cloudbeaver
      - traefik.http.services.cloudbeaver.loadbalancer.server.port=8978
      # The tailnet's address range (Tailscale's CGNAT block); anyone else gets 403.
      - traefik.http.middlewares.cloudbeaver-tailnet.ipallowlist.sourcerange=100.64.0.0/10
      # Forward-auth through Authentik's embedded outpost (application `cloudbeaver`, single-application mode).
      # The address is the Authentik server container on dokploy-network; Dokploy named it
      # (apps/vps/authentik/README.md, "Deploying", step 4). Its "server" alias is not unique on that network.
      # A gate only: CloudBeaver's own login still follows (NOTES.md, "Sign-in").
      - traefik.http.middlewares.cloudbeaver-authentik.forwardauth.address=http://compose-reboot-optical-matrix-gsjyeo-server-1:9000/outpost.goauthentik.io/auth/traefik
      # The outpost's own paths on this hostname (the sign-in callback, sign-out) go to Authentik, tailnet only.
      - traefik.http.routers.cloudbeaver-outpost.rule=Host(`${CLOUDBEAVER_HOST:?}`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.cloudbeaver-outpost.priority=100
      - traefik.http.routers.cloudbeaver-outpost.entrypoints=websecure
      - traefik.http.routers.cloudbeaver-outpost.middlewares=cloudbeaver-tailnet
      - traefik.http.routers.cloudbeaver-outpost.service=authentik@docker
      - traefik.http.routers.cloudbeaver-outpost.tls.certresolver=cloudflare
      - traefik.http.routers.cloudbeaver-outpost.tls.domains[0].main=${ZONE:?}
      - traefik.http.routers.cloudbeaver-outpost.tls.domains[0].sans=*.${ZONE:?}
      - traefik.http.middlewares.cloudbeaver-sablier.plugin.sablier.sablierUrl=http://sablier:10000
      - traefik.http.middlewares.cloudbeaver-sablier.plugin.sablier.group=cloudbeaver
      - traefik.http.middlewares.cloudbeaver-sablier.plugin.sablier.sessionDuration=30m
      - traefik.http.middlewares.cloudbeaver-sablier.plugin.sablier.failOpen=true
      - traefik.http.middlewares.cloudbeaver-sablier.plugin.sablier.dialTimeout=2s
      # Holds the request while it starts, instead of a waiting page.
      - traefik.http.middlewares.cloudbeaver-sablier.plugin.sablier.blocking.timeout=2m
    networks:
      - dokploy-network

volumes:
  cloudbeaver-workspace:

networks:
  dokploy-network:
    external: true
