# A second Hermes WebUI on the VPS
#
# What it is: one more Hermes WebUI on the VPS, deployed by Dokploy, reached
# over a public domain behind the WebUI's own password. Whoever uses it needs
# no Tailscale, no SSH, no lab knowledge — a URL, a login, a chat box.
#
# What it is not: a second login on the existing WebUI. This WebUI is
# single-user by design (one shared password, no accounts), so a separate
# container is the isolation — its sessions, workspace and agent memory never
# touch the owner's.
#
# Status: deployed and in use — the README owns the state, including the
# backup gap.
# Source of the shape: nesquena/hermes-webui docker-compose.yml at tag
# v0.52.544 (single container, WebUI runs the agent in-process), read
# 2026-10-27. The running image is 0.52.561, one build later, for the reason in
# the image comment below. Choices that differ from that file, and why, are in
# this folder's README.

services:
  hermes-webui:
    # Pinned tag, not `latest`: on 2026-10-27 `latest` and `experimental`
    # were the same moving build, hours old. The image has no agent of its
    # own; it runs the one in ~/.hermes/hermes-agent, put there once from
    # nousresearch/hermes-agent v0.22.5 — the release this WebUI version pairs
    # with. Upgrade the two together (README, "First deploy" and "Upgrading").
    # 0.52.561 is the first pinned build that installs agent v0.22.5 by itself:
    # it passes the agent's own `[tool.uv]` overrides to uv, which 0.52.544 did
    # not (upstream #8524, fixed by #8544).
    image: ghcr.io/nesquena/hermes-webui:0.52.561
    restart: unless-stopped
    # No published port: Dokploy's Traefik is the only way in, through the
    # domain set in Dokploy. `expose` names the port for Traefik; without it
    # the domain did not route (owner, 2026-10-27).
    expose:
      - "8787"
    volumes:
      # Named volume, fresh for this app. NOT a bind mount of an existing
      # ~/.hermes: the whole point is a blank home — separate sessions,
      # separate memory, nothing inherited from the owner's instance.
      - hermes-webui-home:/home/hermeswebui/.hermes
      # Workspace, also fresh. Small on purpose: a chat landing folder,
      # not a window into the lab.
      - hermes-webui-workspace:/workspace
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      # Required: this app has a public domain (upstream leaves it empty for
      # localhost use). `:?` stops the deploy when it is unset, so the app
      # can never come up on the internet without a password.
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD:?}

volumes:
  hermes-webui-home:
  hermes-webui-workspace:
