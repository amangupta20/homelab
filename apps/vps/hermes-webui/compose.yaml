# A second Hermes WebUI on the VPS
#
# What it is: one more Hermes WebUI on the VPS, deployed by Dokploy, reached
# over a public domain behind the WebUI's own password. Whoever uses it needs
# no Tailscale, no SSH, no lab knowledge — a URL, a login, a chat box.
#
# What it is not: a second login on the existing WebUI. This WebUI is
# single-user by design (one shared password, no accounts), so a separate
# container is the isolation — its sessions, workspace and agent memory never
# touch the owner's.
#
# Status: deployed and in use — the README owns the state, including the
# backup gap.
# Source of the shape: nesquena/hermes-webui docker-compose.yml at tag
# v0.52.544 (single container, WebUI runs the agent in-process), read
# 2026-10-27. The running image is 0.52.561, one build later, for the reason in
# the image comment below. Choices that differ from that file, and why, are in
# this folder's README.

services:
  # Puts the agent into the home volume, then exits. The WebUI image has no
  # agent of its own; it runs the one in ~/.hermes/hermes-agent. The copy runs
  # only when the image's install-stamp.json (its build commit) differs from
  # the one in the volume, into a temporary folder first, so a failed copy
  # leaves the old agent in place. The two tags here are the release pair:
  # change them together, following agents/skills/update-hermes-webui/.
  agent-src:
    # v0.23.1, not the newer v0.23.2/v0.23.3 (checked 2026-11-21): both break
    # tool turns on a custom chat-completions provider that returns encrypted
    # reasoning (NousResearch/hermes-agent#157091, fix #157528 not merged), and
    # on v0.23.3 deleting a session fails (nesquena/hermes-webui#9213).
    image: nousresearch/hermes-agent:v0.23.1
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        src=/opt/hermes dst=/dst/hermes-agent
        if [ -f "$$dst/install-stamp.json" ] && [ "$$(cat "$$dst/install-stamp.json")" = "$$(cat "$$src/install-stamp.json")" ]; then
          echo "agent already current: $$(cat "$$src/install-stamp.json")"; exit 0
        fi
        rm -rf "$$dst.new"
        cp -a "$$src/." "$$dst.new/"
        rm -rf "$$dst"
        mv "$$dst.new" "$$dst"
        echo "agent copied: $$(cat "$$dst/install-stamp.json")"
    volumes:
      - hermes-webui-home:/dst

  hermes-webui:
    # Pinned tag, not `latest`: `latest` and `experimental` move without
    # warning, so a redeploy could change version under the person using it.
    # Released versions are checked before each bump (the skill above).
    image: ghcr.io/nesquena/hermes-webui:0.52.723
    depends_on:
      agent-src:
        condition: service_completed_successfully
    restart: unless-stopped
    # No published port: Dokploy's Traefik is the only way in, through the
    # domain set in Dokploy. `expose` names the port for Traefik; without it
    # the domain did not route (owner, 2026-10-27).
    expose:
      - "8787"
    volumes:
      # Named volume, fresh for this app. NOT a bind mount of an existing
      # ~/.hermes: the whole point is a blank home — separate sessions,
      # separate memory, nothing inherited from the owner's instance.
      - hermes-webui-home:/home/hermeswebui/.hermes
      # Workspace, also fresh. Small on purpose: a chat landing folder,
      # not a window into the lab.
      - hermes-webui-workspace:/workspace
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      # Required: this app has a public domain (upstream leaves it empty for
      # localhost use). `:?` stops the deploy when it is unset, so the app
      # can never come up on the internet without a password.
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD:?}
      # Sign-in through Authentik by OIDC, next to the password (README,
      # "Sign-in"; NOTES.md, "Sign-in"). Only members of the Authentik groups
      # below get in; Authentik's policy bindings on the application say the same.
      - HERMES_WEBUI_OIDC_ISSUER=https://${AUTHENTIK_DOMAIN:?}/application/o/hermes-webui-1/
      - HERMES_WEBUI_OIDC_CLIENT_ID=${HERMES_WEBUI_OIDC_CLIENT_ID:?}
      - HERMES_WEBUI_OIDC_CLIENT_SECRET=${HERMES_WEBUI_OIDC_CLIENT_SECRET:?}
      # Set, not derived: behind Traefik the app may see http:// as its own
      # scheme, and Authentik matches the redirect URI strictly.
      - HERMES_WEBUI_OIDC_REDIRECT_URI=https://${HERMES_WEBUI_DOMAIN:?}/api/auth/oidc/callback
      - HERMES_WEBUI_OIDC_ALLOW_CLAIM=groups
      - HERMES_WEBUI_OIDC_ALLOW_VALUES=hermes-webui-1,homelab-admins

volumes:
  hermes-webui-home:
  hermes-webui-workspace:
