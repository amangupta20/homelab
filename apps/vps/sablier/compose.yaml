# Sablier: starts a sleeping app on its first request and stops it after an idle period
# (plans/sablier-wakeups.md). Only reachable by Traefik, on dokploy-network.
# Source of the shape and what differs: README.

services:
  socket-proxy:
    # Only this container mounts Docker's socket, and it passes only the calls Sablier's stop strategy makes.
    # Each rule was tried on the VPS with a throwaway proxy, 2026-11-07: these were allowed, and creating
    # containers, exec, kill, update, delete, images, info, logs and file copies were refused (403).
    # arm64 checked with `docker buildx imagetools inspect`, 2026-11-07.
    image: wollomatic/socket-proxy:1.13.2
    restart: unless-stopped
    read_only: true
    # Nobody, in the host's docker group (`getent group docker` on the VPS, 2026-11-07), so it can open the socket.
    user: "65534:989"
    command:
      - -listenip=0.0.0.0
      - -allowfrom=sablier # only the Sablier container, by its name on this network
      - -allowhealthcheck # opens port 55555 inside the container for ./healthcheck; without it the check fails
      - -allowHEAD=(/v1\.[0-9]+)?/_ping
      - -allowGET=(/v1\.[0-9]+)?/(_ping|version|events|containers/json|containers/[a-zA-Z0-9_.-]+/json)
      - -allowPOST=(/v1\.[0-9]+)?/containers/[a-zA-Z0-9_.-]+/(start|stop|wait)
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy

  sablier:
    # Pinned, not `latest`. arm64 checked the same way, 2026-11-07.
    image: sablierapp/sablier:1.19.1
    restart: unless-stopped
    command:
      - start
      - --provider.name=docker
      # Only ever act on containers labelled sablier.enable=true.
      - --provider.reject-unlabeled-requests=true
      - --provider.verify-enabled-on-expiration=true
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
    depends_on:
      socket-proxy:
        condition: service_healthy
    # No published port: Traefik reaches it as http://sablier:10000 on dokploy-network.
    networks:
      - socket-proxy
      - dokploy-network

networks:
  socket-proxy:
    internal: true
  dokploy-network:
    external: true
