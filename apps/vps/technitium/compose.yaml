# Technitium DNS Server on the VPS: the home DNS cluster's secondary node and the
# fallback resolver (README.md here; agents/plans/home-overhaul.md, B4b). The
# primary is the Raspberry Pi (apps/homeserver/technitium/); once this node joins
# the cluster, its blocklists, upstreams, allowlist, users and zones come from
# there.

services:
  technitium:
    # The same release and digest as the Pi's (apps/homeserver/technitium/compose.yaml);
    # the digest's image list includes arm64 (Docker Hub, 2026-11-23).
    image: docker.io/technitium/dns-server:15.6.2@sha256:eb48ac5c135f4ab936b536f74f853d53e15ab39ef37fdbc9598a089b90d9f245
    restart: unless-stopped
    # Published on the VPS's tailnet address only, never on a public one: an open
    # resolver on the internet gets abused. systemd-resolved holds 127.0.0.53/54:53
    # on the host, so host networking would clash; on this bridge, published ports
    # keep the client's tailnet address (Docker's DNAT).
    ports:
      - "${VPS_TAILNET_ADDRESS:?set it from kv/dokploy/technitium}:53:53/udp"
      - "${VPS_TAILNET_ADDRESS:?}:53:53/tcp"
      # The web console, and the cluster's HTTPS API (self-signed) that the Pi calls.
      - "${VPS_TAILNET_ADDRESS:?}:5380:5380/tcp"
      - "${VPS_TAILNET_ADDRESS:?}:53443:53443/tcp"
    mem_limit: 1g
    # From Technitium's own compose file (README, "Derived from" in NOTES.md).
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5380/api/dnsClient/healthCheck | grep '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # More source ports for upstream queries on a bridge network (same source).
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65535
    environment:
      # Read only on the first start. Joining the cluster then replaces the settings
      # and the admin user with the Pi's, so this password matters only until then.
      DNS_SERVER_DOMAIN: vps
      DNS_SERVER_ADMIN_PASSWORD: ${TECHNITIUM_ADMIN_PASSWORD:?set it from kv/dokploy/technitium}
      DNS_SERVER_WEB_SERVICE_HTTP_PORT: "5380"
      DNS_SERVER_LOG_USING_LOCAL_TIME: "true"
      DNS_SERVER_LOG_MAX_LOG_FILE_DAYS: "7"
      DNS_SERVER_STATS_MAX_STAT_FILE_DAYS: "30"
    volumes:
      # Settings, the cluster's state, zones copied from the Pi, stats and logs.
      - technitium-data:/etc/dns

volumes:
  technitium-data:
