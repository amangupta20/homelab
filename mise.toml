# Toolchain for this repo. Run `mise install` once per checkout, then
# `mise run hooks:install` to point git at the tracked hooks.
[tools]
gitleaks = "8.30.1"
opentofu = "1.13.2"
tflint = "0.65.0"
ansible-core = "2.21.5"
rclone = "1.76.0"

[tasks."hooks:install"]
description = "Point git at the tracked hooks (once per checkout)"
run = "git config core.hooksPath .githooks && echo 'core.hooksPath=.githooks'"

[tasks."agents:link"]
description = "Link agents/skills/ into agent harnesses that only read a home-directory folder"
run = "sh agents/link.sh"

[tasks.scan]
description = "Scan the full git history for secrets"
run = """
. .githooks/scan-config.sh
tmp=$(mktemp)
trap 'rm -f "$tmp"' EXIT
build_scan_config "$tmp"
gitleaks git --redact --no-banner -v -c "$tmp"
"""

[tasks."check:properties"]
description = "Check the page properties the Obsidian view reads (agents/obsidian/obsidian-view.md)"
run = "python3 -I .githooks/check-properties.py"

[tasks."check:cache-clients"]
description = "Check every home VM in ansible/inventory.yml uses the LAN cache or is exempt (ansible/README.md)"
run = "python3 -I .githooks/check-cache-clients.py"

[tasks."check:docs"]
description = "Check doc rules: paths resolve and use the new folders, no dates in human tables, length caps, danger rules in owner files (.githooks/check-docs.py)"
run = "python3 -I .githooks/check-docs.py"
