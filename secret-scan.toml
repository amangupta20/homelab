# Secret-scanning rules for gitleaks.
#
# Extends gitleaks' built-in ruleset (AWS keys, private keys, tokens, ...) and
# adds only repo-specific exceptions, each with a stated reason. Anything that
# looks like a real credential belongs in OpenBao, not in this file.

[extend]
useDefault = true

[[allowlists]]
description = "Documented placeholders: text that tells a human to paste a real value. Never real credentials."
regexes = [
  '''__PASTE_[A-Z0-9_]*__''',
  '''PASTE_[A-Z0-9_]*''',
  '''<[a-z][a-z0-9-]*>''',
]

# The built-in AWS rule only fires when an "aws"-ish keyword sits near the key,
# so a key dropped into a comment or a stray line is missed. This rule matches
# the key shape anywhere, including inside a config file.
[[rules]]
id = "aws-access-key-id-uncontexted"
description = "AWS access key ID with no keyword context required"
regex = '''\b(?:AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}\b'''
tags = ["key", "AWS"]
