# Secret-scanning rules for gitleaks.
#
# Extends gitleaks' built-in ruleset (AWS keys, private keys, tokens, ...) and
# adds only repo-specific exceptions, each with a stated reason. Anything that
# looks like a real credential belongs in OpenBao, not in this file.

[extend]
useDefault = true

[[allowlists]]
description = "Documented placeholders: text that tells a human to paste a real value. Never real credentials."
regexes = [
  '''__PASTE_[A-Z0-9_]*__''',
  '''PASTE_[A-Z0-9_]*''',
  '''<[a-z][a-z0-9-]*>''',
]

# The built-in AWS rule only fires when an "aws"-ish keyword sits near the key,
# so a key dropped into a comment or a stray line is missed. This rule matches
# the key shape anywhere, including inside a config file.
[[rules]]
id = "aws-access-key-id-uncontexted"
description = "AWS access key ID with no keyword context required"
regex = '''\b(?:AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}\b'''
tags = ["key", "AWS"]

# This repo is public, so lab details that are harmless on a private network
# are leaks here. The two rules below need no private knowledge, so they live
# in this tracked file and run everywhere, CI included. Your own domains cannot
# be listed here without publishing them: they go in secret-scan.local.toml
# (git-ignored), see repo/secret-scanning.md.

# Any IPv4 address that is reachable from the internet. Private, Tailscale
# (100.64.0.0/10), loopback, link-local and documentation ranges are allowed,
# so `10.22.33.160` passes and the real public IP of the lab does not.
[[rules]]
id = "public-ipv4"
description = "Public IPv4 address (only private and documentation ranges belong in this repo)"
regex = '''\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b'''
tags = ["network", "public-repo"]

[[rules.allowlists]]
description = "Non-routable and documentation ranges"
regexTarget = "match"
regexes = [
  '''^10\.''',
  '''^192\.168\.''',
  '''^172\.(?:1[6-9]|2\d|3[01])\.''',
  '''^100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.''',
  '''^127\.''',
  '''^169\.254\.''',
  '''^0\.0\.0\.0$''',
  '''^255\.255\.255\.''',
  '''^192\.0\.2\.''',
  '''^198\.51\.100\.''',
  '''^203\.0\.113\.''',
]

# A Tailscale MagicDNS name (host.tailXXXX.ts.net) identifies the tailnet.
# Write `<host>.<tailnet>.ts.net` in docs instead.
[[rules]]
id = "tailscale-hostname"
description = "Tailscale MagicDNS hostname"
regex = '''\b[a-z0-9-]+\.ts\.net\b'''
tags = ["network", "public-repo"]
